<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CyberPose MIDI - Korg NTS-1 Controller</title>
  <meta name="theme-color" content="#060913" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="manifest" href="./manifest.json" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #060913;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 10px;
      overflow-y: auto;
    }
    .mirror-view { transform: scaleX(-1); object-fit: cover; }
    .btn-hold-square {
      width: 44px; height: 44px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; border-radius: 10px;
      font-weight: 800; font-family: monospace; font-size: 10px;
      transition: all 0.15s ease-out; cursor: pointer;
      background: #090e1d; border: 2px solid #334155; color: #cbd5e1;
    }
    .btn-hold-active {
      background-color: #0284c7 !important; border-color: #38bdf8 !important;
      color: #ffffff !important; box-shadow: 0 0 16px rgba(56, 189, 248, 0.7);
      transform: scale(0.96);
    }
    .pad-grid {
      background-image: 
        linear-gradient(to right, rgba(0, 243, 255, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 243, 255, 0.15) 1px, transparent 1px);
      background-size: 20% 20%;
    }
    .pad-subgrid {
      background-image: 
        linear-gradient(to right, rgba(236, 72, 153, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(236, 72, 153, 0.08) 1px, transparent 1px);
      background-size: 5% 5%;
    }

      -webkit-appearance: none; appearance: none; writing-mode: vertical-lr; direction: rtl;
